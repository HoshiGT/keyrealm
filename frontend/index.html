<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <title>Credential Vault</title>
    <script>
      /* 首屏防闪：在样式表加载前就把主题写到 <html>，并铺一层底色。
         这里必须与 src/theme/themes.js 的深色清单保持一致（脚本无法 import 模块）。
         改主题时两处一起改；不一致的后果只是「深色主题首帧白闪一下」。 */
      ;(function () {
        var DARK = { midnight: 1, obsidian: 1, nebula: 1 }
        var BG = { dark: '#0b0e17', light: '#f6f7fb' }
        var el = document.documentElement
        var id = 'obsidian'
        try {
          id = localStorage.getItem('vault.ui.theme') || id
        } catch (e) {}
        var isDark = !!DARK[id]
        el.dataset.theme = id
        if (isDark) el.classList.add('dark')
        el.style.colorScheme = isDark ? 'dark' : 'light'
        el.style.background = isDark ? BG.dark : BG.light
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
